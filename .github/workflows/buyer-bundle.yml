name: Verivaro synthetic buyer handover
on:
  push:
    branches:
      - audit/g1-restore-catalog-verification-20261121
  workflow_dispatch:

concurrency:
  # A newer commit supersedes redundant checks on the same branch/PR.
  # Final-head jobs retain every existing security and evidence assertion.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Verify zero-dependency buyer bundle and negative fixtures
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --experimental-strip-types --test tests/unit/buyer-portable-bundle.test.mjs
      - name: Build independently inspectable synthetic buyer ZIP
        env:
          VV_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --experimental-strip-types buyer-bundle.mjs \
            "$RUNNER_TEMP/verivaro-synthetic-buyer.zip" | tee "$RUNNER_TEMP/buyer-bundle-receipt.json"
          unzip -t "$RUNNER_TEMP/verivaro-synthetic-buyer.zip"
          test "$(unzip -Z1 "$RUNNER_TEMP/verivaro-synthetic-buyer.zip" | wc -l)" -eq 8
          unzip -p "$RUNNER_TEMP/verivaro-synthetic-buyer.zip" buyer-offline.html > "$RUNNER_TEMP/buyer-offline.html"
          test -s "$RUNNER_TEMP/buyer-offline.html"
          sha256sum "$RUNNER_TEMP/verivaro-synthetic-buyer.zip"
      - name: Inventory locked source dependencies and pinned actions
        env:
          VV_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          node buyer-ip-inventory.mjs "$RUNNER_TEMP/buyer-ip-inventory.json" | tee "$RUNNER_TEMP/buyer-ip-receipt.json"
          test -s "$RUNNER_TEMP/buyer-ip-inventory.json"
          test -s "$RUNNER_TEMP/buyer-ip-receipt.json"
          sha256sum "$RUNNER_TEMP/buyer-ip-inventory.json"
      - name: Upload review artifact only (not deploy)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verivaro-synthetic-buyer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/verivaro-synthetic-buyer.zip
            ${{ runner.temp }}/buyer-bundle-receipt.json
            ${{ runner.temp }}/buyer-offline.html
            ${{ runner.temp }}/buyer-ip-inventory.json
            ${{ runner.temp }}/buyer-ip-receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
