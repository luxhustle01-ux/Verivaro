name: G1 browser workspace usability
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  # A newer commit supersedes redundant checks on the same branch/PR.
  # Final-head jobs retain every existing security and evidence assertion.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.engine == 'webkit' && 55 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install pinned browser test tooling
        timeout-minutes: 4
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/vv-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.56.1
      - name: Configure reliable browser system package downloads
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # The runner's EC2 package mirror timed out downloading WebKit's
          # dependency set for both engines. Use Ubuntu's official HTTPS archive when its
          # runner-provided mirror list is present. Preserve apt signatures.
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "60";' 'Acquire::https::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/80-verivaro-ci >/dev/null
      - name: Install browser system dependencies
        timeout-minutes: ${{ matrix.engine == 'webkit' && 32 || 18 }}
        run: |
          set -euo pipefail
          # A signed index can change while a mirror is synchronizing. Retry
          # provisioning only, never browser assertions or signature checks.
          for attempt in 1 2 3; do
            if test -f /etc/apt/apt-mirrors.txt; then
              mirror=https://archive.ubuntu.com/ubuntu/
              if test "$attempt" = 2; then mirror=https://us.archive.ubuntu.com/ubuntu/; fi
              printf '%s\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            if node "$RUNNER_TEMP/vv-browser/node_modules/playwright/cli.js" install-deps ${{ matrix.engine }}; then exit 0; fi
            if test "$attempt" = 3; then exit 1; fi
            sudo rm -rf /var/lib/apt/lists/partial
            sudo mkdir -p /var/lib/apt/lists/partial
            sleep $((attempt * 15))
          done
          exit 1
      - name: Install pinned browser binary
        timeout-minutes: 6
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/vv-browser/node_modules/playwright/cli.js" install ${{ matrix.engine }}
      - name: Exercise workspace in real browser engine
        timeout-minutes: 14
        env:
          VV_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          # Isolate each browser file to avoid competing WebKit/Chromium event
          # loops and networkidle waits on a single constrained CI runner.
          # A watchdog fails (never skips) a hung browser file with a clear limit.
          for fixture in tests/browser/buyer-showcase-browser.test.mjs tests/browser/offline-buyer-browser.test.mjs tests/browser/workspace-browser.test.mjs; do
            echo "browser_file=$fixture engine=$VV_BROWSER_ENGINE"
            timeout --signal=TERM --kill-after=15s 270s env VV_BROWSER_DIR="$RUNNER_TEMP/vv-browser" node --experimental-strip-types --test-concurrency=1 --test "$fixture"
          done
